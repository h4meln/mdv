<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDV APS/ETS</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="stylesheet" href="public/css/base.css">
<link rel="stylesheet" href="public/css/pages/eventi.css">
<link rel="stylesheet" href="assets/fonts/fonts.css">
</head>
<body>
<main class="page">

  <h1>Ci vediamo al Mondo</h1>
  <p class="events-intro">Concerti, incontri e vita associativa. Scegli un giorno per scoprire gli appuntamenti, oppure apri l’agenda.</p>
  <!-- ── calendar ── -->
  <mdv-calendar></mdv-calendar>
</main>

<!-- ── nav ── -->
<mdv-eggbar active="eventi"></mdv-eggbar>

<!-- ── toast ── -->
<mdv-toast
  icon="heart"
  title="SALVA IL MONDO!"
  sub-title="Una casa per la musica. Un futuro da costruire insieme."
  text="La nostra sede è a rischio. Aiutaci a dare un futuro al Mondo delle Uova: {link}, condividi la campagna e scopri il progetto."
  link="https://gofund.me/b99d7e8c9"
  link-label="sostieni la raccolta fondi"
  pdf="assets/doc/documento-di-buona-causa.pdf"
  pdf-label="Documento di buona causa"
  pdf-meta="PDF · Apri documento"
  delay="0.35"
></mdv-toast>

<!-- ── components ── -->
<script type="module" src="components/eggbar/eggbar.js"></script>
<script type="module" src="components/toast/toast.js"></script>
<script type="module" src="components/calendar/calendar.js"></script>
</body>
</html>
